TEST123<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>body{margin:0}</style>
<title>Spud Siege</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: a night-time "class score barometer": one big shared number and a thick fill bar, join codes as chunky letter tiles. Single dark look to match the game. */
:root{
  --paper:#141019; --surface:#211a2e; --sunk:#2c2340; --ink:#f3edfc; --muted:#a99dc6; --line:#ffffff14;
  --accent:#ffd447; --accent-ink:#2f2100; --accent-soft:#3a3020;
  --cobalt:#6aa8ff; --cobalt-ink:#0f0b17;
  --good:#4fd68e; --bad:#ff6b7a; --track:#2c2340;
  --display:"Lilita One", "Arial Black", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px; color-scheme:dark; font-synthesis:none;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.k{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
.view{max-width:1240px;margin:0 auto;padding-block:28px 40px}

/* Buttons */
.btn{appearance:none;border:0;border-radius:999px;padding:.75rem 1.4rem;font-weight:700;cursor:pointer;
  background:var(--sunk);color:var(--ink);transition:transform .12s, filter .12s}
.btn:hover{filter:brightness(1.04)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.blue{background:var(--cobalt);color:var(--cobalt-ink)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.big{font-size:1.15rem;padding:.95rem 1.8rem}
.link{appearance:none;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.92rem}

/* Home */
.brand{display:grid;gap:14px;max-width:760px;margin-bottom:34px}
.wordmark{display:flex;align-items:center;gap:14px}
.logo{display:grid;grid-template-columns:repeat(3,14px);gap:4px;align-items:end;height:44px}
.logo i{display:block;border-radius:4px;background:var(--accent)}
.logo i:nth-child(1){height:18px;background:var(--cobalt)} .logo i:nth-child(2){height:30px} .logo i:nth-child(3){height:44px}
.brand h1{font-size:clamp(2.6rem,7vw,4.4rem);font-weight:800;letter-spacing:-.02em}
.brand p{margin:0;font-size:1.2rem;color:var(--muted);max-width:52ch}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.door{appearance:none;text-align:left;border:0;cursor:pointer;background:var(--surface);border-radius:20px;padding:26px;
  display:grid;gap:8px;box-shadow:0 1px 0 var(--line), 0 12px 30px -18px #0b1640;transition:transform .15s}
.door:hover:not([disabled]){transform:translateY(-3px)}
.door[disabled]{cursor:not-allowed;opacity:.55}
.door{place-items:center;padding:34px 26px}
.door.solo{background:var(--sunk)}
.door.solo strong{color:var(--accent)}
.door strong{font-family:var(--display);font-size:2.6rem;font-weight:400}
.door span:last-child{color:var(--muted)}
.door .k{color:var(--cobalt)}
.door .note{color:var(--bad);font-size:.92rem}
.mode{margin:26px 0 0;color:var(--muted);font-size:.95rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;flex:none;transform:translateY(-1px)}
.dot.live{background:var(--good)} .dot.test{background:var(--accent)}

/* Forms */
.panel{background:var(--surface);border-radius:20px;padding:28px;max-width:560px;display:grid;gap:20px;box-shadow:0 1px 0 var(--line)}
.panel h2{font-size:2rem}
.field{display:grid;gap:6px}
.field label{font-weight:700}
.field small{color:var(--muted)}
.input{width:100%;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:.7rem .9rem;font-size:1.05rem}
.input:focus{border-color:var(--cobalt);outline:none}
.codeinput{font-family:var(--display);font-size:2.2rem;font-weight:800;letter-spacing:.35em;text-transform:uppercase;text-align:center;padding:.4rem .5rem .4rem .85rem}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.error{color:var(--bad);font-weight:700;margin:0;min-height:1.5em}
.back{margin-bottom:18px}

/* Join-code tiles */
.tiles{display:flex;gap:8px}
.tile{width:clamp(44px,5.4vw,64px);aspect-ratio:1/1.1;max-width:100%;display:grid;place-items:center;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,3.4vw,2.7rem);
  box-shadow:inset 0 -5px 0 #0000002a}

/* Teacher dashboard */
.dash{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:28px;align-items:start}
.rail{display:grid;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:0 1px 0 var(--line);display:grid;gap:12px}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.pill{display:inline-flex;align-items:center;gap:8px;padding:.3rem .8rem;border-radius:999px;font-weight:700;font-size:.9rem;background:var(--sunk)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.lobby{color:var(--cobalt)} .pill.playing{color:var(--good)} .pill.paused{color:var(--accent)} .pill.ended{color:var(--muted)}
.statusrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.controls{display:grid;gap:10px}
.controls .btn{width:100%}
.settings{display:grid;gap:12px}
.settings .input{font-size:.98rem;padding:.55rem .75rem}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:700}
.toggle input{width:20px;height:20px;accent-color:var(--cobalt)}
.board{display:grid;gap:22px;min-width:0}
.titlebar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.titlebar h2{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:700}
.clock{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4vw,3.2rem);font-variant-numeric:tabular-nums;line-height:1}
.clock.low{color:var(--bad)}
.clockwrap{text-align:right;display:grid;gap:4px}
.score{display:grid;gap:4px}
.big{font-family:var(--display);font-weight:800;font-size:clamp(4.5rem,13vw,10.5rem);line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.of{font-size:1.25rem;color:var(--muted)}
.of b{color:var(--ink)}
.meter{position:relative;height:34px;border-radius:999px;background:var(--track);overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.meter.done .fill{background:var(--good)}
.meter .tick{position:absolute;top:6px;bottom:6px;width:2px;background:var(--paper);opacity:.75}
.ticklabels{position:relative;height:1.3em;font-size:.85rem;color:var(--muted)}
.ticklabels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticklabels span:last-child{transform:translateX(-100%)}
.ticklabels span:first-child{transform:none}
.banner{background:var(--good);color:var(--surface);border-radius:var(--r);padding:14px 20px;font-family:var(--display);font-weight:800;font-size:1.5rem}
.summary{background:var(--accent-soft);border-radius:var(--r);padding:16px 20px;font-size:1.1rem}
.playershead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.playershead h3{font-size:1.4rem}
.players{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.playershead .cap{color:var(--muted);font-size:.8em}
.players li{background:var(--surface);border-radius:12px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 0 var(--line);min-width:0}
.players .rank{font-family:var(--display);font-weight:800;color:var(--muted);width:1.6em;flex:none;font-variant-numeric:tabular-nums}
.players .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.players .pscore{font-family:var(--display);font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}
.players li.top .rank{color:var(--accent)}
.players .x{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px;padding:2px 6px;font-size:.8rem;font-weight:700}
.players .x:hover{color:var(--bad)}
.players .x.armed{background:var(--bad);color:var(--surface)}
.players li.new{animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}
.empty{color:var(--muted);background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:22px;margin:0}

/* Student */
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-radius:var(--r);padding:12px 18px;
  display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;box-shadow:0 1px 0 var(--line), 0 10px 24px -20px #0b1640}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.sbar > div{display:grid;gap:0;min-width:0}
.sbar strong{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.sbar .who strong{font-size:1.25rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:16ch}
.sbar .classbox{flex:1;min-width:180px}
.sbar .classline{display:flex;align-items:baseline;gap:6px}
.sbar .classline span{color:var(--muted)}
.minimeter{height:10px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:4px}
.minimeter .fill{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .6s}
.minimeter.done .fill{background:var(--good)}
.mine{position:relative}
.float{position:absolute;right:-8px;top:-6px;font-family:var(--display);font-weight:800;color:var(--good);pointer-events:none;animation:rise .9s ease-out forwards}
@keyframes rise{from{transform:translateY(6px);opacity:1}to{transform:translateY(-22px);opacity:0}}
.stagewrap{position:relative;margin-top:18px;min-height:min(62vh,560px);display:grid}
#game-stage{background:var(--surface);border-radius:20px;box-shadow:0 1px 0 var(--line);min-height:inherit;overflow:hidden;display:grid}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;border-radius:20px;
  background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(4px)}
.overlay .msg{text-align:center;display:grid;gap:12px;justify-items:center;max-width:46ch}
.overlay h2{font-size:clamp(2rem,5vw,3rem)}
.overlay p{margin:0;font-size:1.15rem;color:var(--muted)}
.overlay .bignum{font-family:var(--display);font-weight:800;font-size:clamp(3rem,9vw,5.5rem);line-height:1;color:var(--ink)}
.sfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:.9rem}
.waitdots{display:flex;gap:8px}
.waitdots i{width:12px;height:12px;border-radius:4px;background:var(--accent);animation:bob 1.2s infinite ease-in-out}
.waitdots i:nth-child(2){animation-delay:.15s;background:var(--cobalt)} .waitdots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* Placeholder game */
.ph{display:grid;place-items:center;align-content:center;gap:18px;padding:32px;text-align:center;border:3px dashed var(--line);margin:16px;border-radius:16px}
.ph h3{font-size:1.8rem}
.ph p{margin:0;color:var(--muted);max-width:48ch}
.ph .row{justify-content:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:.7rem 1.1rem;border-radius:12px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}

@media (max-width:860px){
  .dash{grid-template-columns:1fr}
  .rail{position:static}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

</head>
<body>
<main id="app">

  <!-- HOME -->
  <section class="view" id="v-home">
    <header class="brand">
      <div class="wordmark"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><h1 id="h-title">Class Combo</h1></div>
    </header>
    <div class="doors">
      <button class="door" id="go-teacher" disabled><strong>Host</strong></button>
      <button class="door" id="go-student" disabled><strong>Join</strong></button>
      <button class="door solo" id="go-solo" disabled><strong>Solo</strong></button>
    </div>
    <p class="mode" id="mode-line"><span class="dot"></span><span>…</span></p>
  </section>

  <!-- TEACHER SETUP -->
  <section class="view" id="v-setup" hidden>
    <button class="link back" data-go="home">← Back</button>
    <form class="panel" id="setup-form" novalidate>
      <h2>New game</h2>
      <div class="field">
        <label for="f-title">Name</label>
        <input class="input" id="f-title" maxlength="40" value="Spud Siege">
      </div>
      <div class="field">
        <label for="f-goal">Class goal</label>
        <input class="input num" id="f-goal" type="number" min="1" step="1" value="1000">
      </div>
      <div class="field">
        <label for="f-dur">Time</label>
        <select class="input" id="f-dur">
          <option value="0">No time limit</option>
          <option value="180">3 minutes</option>
          <option value="300">5 minutes</option>
          <option value="600">10 minutes</option>
          <option value="900" selected>15 minutes</option>
          <option value="1200">20 minutes</option>
          <option value="1800">30 minutes</option>
        </select>
      </div>
      <p class="error" id="setup-err"></p>
      <div class="row"><button class="btn primary big" type="submit" id="f-create">Create</button></div>
    </form>
  </section>

  <!-- TEACHER DASHBOARD -->
  <section class="view dash" id="v-teacher" hidden>
    <aside class="rail">
      <div class="card">
        <span class="k">Code</span>
        <div class="tiles" id="t-code" aria-label="Join code"></div>
      </div>
      <div class="card">
        <div class="statusrow"><span class="pill lobby" id="t-status">Waiting to start</span><span class="k" id="t-round">Round 1</span></div>
        <div class="controls" id="t-controls"></div>
      </div>
      <div class="card settings" id="t-settings">
        <span class="k">Settings</span>
        <div class="field"><label for="s-title">Name</label><input class="input" id="s-title" maxlength="40"></div>
        <div class="field"><label for="s-goal">Class goal</label><input class="input num" id="s-goal" type="number" min="1" step="1"></div>
        <div class="field"><label for="s-dur">Time</label>
          <select class="input" id="s-dur">
            <option value="0">No time limit</option><option value="180">3 minutes</option><option value="300">5 minutes</option>
            <option value="600">10 minutes</option><option value="900">15 minutes</option><option value="1200">20 minutes</option><option value="1800">30 minutes</option>
          </select></div>
        <p id="s-lock" hidden>Locked during a round</p>
      </div>
      <label class="toggle"><input type="checkbox" id="t-showscores" checked> Show points</label>
      <button class="link" id="t-close">Leave</button>
    </aside>

    <div class="board">
      <div class="titlebar">
        <h2 id="t-title">Class Combo</h2>
        <div class="clockwrap"><span class="k" id="t-clocklabel">Time</span><span class="clock" id="t-clock">5:00</span></div>
      </div>
      <div class="score">
        <span class="big" id="t-total" aria-live="polite">0</span>
        <span class="of" id="t-of">of <b>1 000</b> points</span>
      </div>
      <div>
        <div class="meter" id="t-meter"><div class="fill"></div><i class="tick" style="left:25%"></i><i class="tick" style="left:50%"></i><i class="tick" style="left:75%"></i></div>
        <div class="ticklabels" id="t-ticks"></div>
      </div>
      <div class="banner" id="t-goal" hidden>Goal reached!</div>
      <div class="summary" id="t-summary" hidden></div>
      <div class="playershead"><h3>Players <span class="num" id="t-count">0</span><span class="cap num"> / 30</span></h3></div>
      <ol class="players" id="t-players"></ol>
      <p class="empty" id="t-empty">Waiting for players…</p>
    </div>
  </section>

  <!-- STUDENT JOIN -->
  <section class="view" id="v-join" hidden>
    <button class="link back" data-go="home">← Back</button>
    <form class="panel" id="join-form" novalidate>
      <h2>Join</h2>
      <div class="field">
        <label for="j-code">Code</label>
        <input class="input codeinput" id="j-code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
      </div>
      <div class="field">
        <label for="j-name">Name</label>
        <input class="input" id="j-name" maxlength="20" autocomplete="off" placeholder="">
      </div>
      <p class="error" id="join-err"></p>
      <div class="row"><button class="btn primary big" type="submit" id="j-go">Join</button></div>
    </form>
  </section>

  <!-- STUDENT PLAY -->
  <section class="view" id="v-student" hidden>
    <header class="sbar">
      <div class="who"><strong id="p-name">–</strong></div>
      <div class="mine"><span class="k">You</span><strong id="p-score">0</strong></div>
      <div class="classbox">
        <span class="k" id="p-gtitle">Class score</span>
        <div class="classline"><strong id="p-total">0</strong><span id="p-goal">/ 1 000</span></div>
        <div class="minimeter" id="p-meter"><div class="fill"></div></div>
      </div>
      <div><span class="k" id="p-clocklabel">Time</span><strong id="p-clock">–</strong></div>
    </header>
    <div class="stagewrap">
      <div id="game-stage"></div>
      <div class="overlay" id="p-overlay" aria-live="polite"><div class="msg" id="p-msg"></div></div>
    </div>
    <div class="sfoot"><button class="link" id="p-leave">Leave</button><span id="p-mode"></span></div>
  </section>
</main>
<canvas id="confetti" hidden></canvas>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* =====================================================================
   GAME — "Spud Siege"
   ---------------------------------------------------------------------
   Loop per wave: quiz (grow crops) -> harvest (crops become XP) ->
   pick upgrades -> defend the base with the class -> next wave.
   After the last wave comes the Last Stand, which ramps up until the
   base falls (always under a minute).

   The shell gives the game an `api`:
     api.addPoints(n)     add n points for this student and the class
     api.playerName       the student's name
     api.setStats(obj)    share small stats (here: level) with classmates
     api.getClassmates()  [{name, lv}] of the other students in the game
   and calls mount / pause / resume / unmount.
   Tune the numbers in CFG, the questions in QUESTIONS, the upgrades in
   UPGRADES and the enemies in ZOMBIES.
   ===================================================================== */
const Game = (() => {
  const CFG = {
    rounds: 10,              // waves before the Last Stand
    quizSeconds: 30,         // quiz time per wave
    pickSeconds: 10,         // time to pick upgrades before auto-pick
    waveSeconds: [10, 15],   // each defense lasts between these
    finalMaxSeconds: 60,     // the Last Stand never lasts longer than this
    maxPlayers: 30,          // students per game (keep equal to MAX_PLAYERS in the shell)
    teamScale: .55,          // how much harder each helper makes a defense (0 = no scaling)
    mathShare: 0.4,          // share of questions that are quick maths
    wrongPauseMs: 900,       // short lock after a wrong answer (stops guess-spamming)
    points: { correct: 10, kill: 1, wave: 20, finalSecond: 3 }
  };

  // [question, correct answer, wrong, wrong, wrong]
  const QUESTIONS = [
    ['Capital of France?', 'Paris', 'Lyon', 'Madrid', 'Rome'],
    ['Largest planet in our solar system?', 'Jupiter', 'Saturn', 'Earth', 'Neptune'],
    ['How many continents are there?', '7', '5', '6', '8'],
    ['H₂O is the formula for…', 'Water', 'Salt', 'Oxygen', 'Sugar'],
    ['Which gas do plants take in?', 'Carbon dioxide', 'Oxygen', 'Nitrogen', 'Helium'],
    ['Fastest land animal?', 'Cheetah', 'Lion', 'Horse', 'Greyhound'],
    ['Capital of Spain?', 'Madrid', 'Barcelona', 'Seville', 'Lisbon'],

        if (b.t > 40) b.hp -= b.hpMax * .05 * (b.t - 40) * dt;  // the fence gives way: guarantees an end
        if (b.t >= CFG.finalMaxSeconds) b.hp = 0;
      } else {
        const win = b.dur * .78;
        if (b.t < win) { b.acc += b.total / win * dt; while (b.acc >= 1) { b.acc--; spawnZ(kindFor(R.round)); } }
        if (R.round >= CFG.rounds && !b.bossDone && b.t > .3) { b.bossDone = true; spawnZ('boss'); }
      }
      b.hp = Math.min(b.hpMax, b.hp + st.regen * dt);
    }
    // shooters
    for (const s of b.shooters) {
      const sx = s.ox * br, sy = s.oy * br;
      s.kick = Math.max(0, s.kick - dt * 6);
      if (calm) continue;
      s.cd -= dt;
      let tgt = null, best = (s.range * U) ** 2;
      for (const z of b.zs) { if (z.dead) continue; const dx = z.x - sx, dy = z.y - sy, d = dx * dx + dy * dy; if (d < best) { best = d; tgt = z; } }
      if (tgt) {
        const want = Math.atan2(tgt.y - sy, tgt.x - sx);
        s.aim = angLerp(s.aim, want, Math.min(1, dt * 18));
        if (s.cd <= 0) { fire(s, sx, sy, want); s.cd = 1 / s.rate; }
      }
      if (s.cd < 0) s.cd = 0;
    }
    // bullets
    for (const bl of b.bullets) {
      bl.x += bl.vx * dt; bl.y += bl.vy * dt; bl.life -= dt;
      if (bl.life <= 0) { bl.dead = true; continue; }
      for (const z of b.zs) {
        if (z.dead || bl.hits.includes(z)) continue;
        const rr = (z.size + 4) * U, dx = z.x - bl.x, dy = z.y - bl.y;
        if (dx > rr || dx < -rr || dy > rr || dy < -rr || dx * dx + dy * dy > rr * rr) continue;
        bl.hits.push(z);
        const d = Math.hypot(z.x, z.y) || 1; z.x += z.x / d * 4 * U; z.y += z.y / d * 4 * U;
        if (bl.you && st.slow && Math.random() < st.slow) z.slow = 1.6;
        hitZ(z, bl.dmg, bl.crit, bl.you);
        if (bl.you && st.pop) explode(bl.x, bl.y, 34 * U * (1 + .25 * (st.pop - 1)), bl.dmg * .5, false);
        if (bl.pierce-- <= 0) { bl.dead = true; break; }
      }
    }
    b.bullets = b.bullets.filter(x => !x.dead);
    // bombs
    b.bombCd = Math.max(0, b.bombCd - dt);
    for (const bm of b.bombs) {
      bm.t += dt;
      if (bm.t >= bm.dur) { bm.dead = true; explode(bm.x1, bm.y1, st.bombR * U, st.bombDmg, true); shakeA = Math.max(shakeA, 10); SFX.boom(); }
    }
    b.bombs = b.bombs.filter(x => !x.dead);
    // zombies
    for (const z of b.zs) {
      if (z.dead) continue;
      z.flash -= dt; z.slow -= dt;
      const d = Math.hypot(z.x, z.y) || 1, stop = br + z.size * U * .75;
      if (d > stop) {
        const sp = z.speed * U * (z.slow > 0 ? .5 : 1) * (d > H * .5 ? 1.9 : 1);  // rush in from the far edges
        z.x -= z.x / d * sp * dt; z.y -= z.y / d * sp * dt; z.wob += dt * 7 * (z.speed / 40);
      } else {
        z.wob += dt * 16;
        if (!calm) {
          b.hp -= z.dps * dt; SFX.fence();
          if (Math.random() < dt * 2.5) burst(W / 2 + z.x * .9, battleCY() + z.y * .9, 2, '#a8743f', 120, 3, 300, .4);
          if (st.thorns) { z.hp -= st.thorns * dt; z.flash = Math.max(z.flash, .02); if (z.hp <= 0) killZ(z, true); }
        }
      }
    }
    const zs = b.zs;
    for (let i = 0; i < zs.length; i++) {
      const a = zs[i]; if (a.dead) continue;
      for (let j = i + 1; j < zs.length; j++) {
        const c = zs[j]; if (c.dead) continue;
        const dx = c.x - a.x, dy = c.y - a.y, m = (a.size + c.size) * U * .9;
        if (dx > m || dx < -m || dy > m || dy < -m) continue;

        if (d2 < m * m && d2 > .01) { const d = Math.sqrt(d2), k = (m - d) / 2 / d; a.x -= dx * k; a.y -= dy * k; c.x += dx * k; c.y += dy * k; }
      }
      const d = Math.hypot(a.x, a.y) || 1, stop = br + a.size * U * .75;
      if (d < stop) { a.x = a.x / d * stop; a.y = a.y / d * stop; }
    }
    b.zs = zs.filter(z => !z.dead);
    if (calm) return;
    if (b.hp <= 0) { lose(); return; }
    if (!b.final && b.t >= b.dur) win();
  }

  function win() {
    for (const z of bat.zs) killZ(z, false);
    bat.zs = []; bat.bullets = []; bat.bombs = [];
    R.pts += CFG.points.wave; api.addPoints(CFG.points.wave);
    banner('SURVIVED!', '#7dffb2'); SFX.win(); canvasAim(false);
    setPhase('cleared', 1.5);
  }
  function afterCleared() {
    if (R.round >= CFG.rounds) { setupBattle(true); banner('LAST STAND', '#ff6b6b'); return; }
    R.round++;
    doIris(() => startRound());
  }
  function lose() {
    const b = bat; b.hp = 0; SFX.lose(); shakeA = 18; canvasAim(false);
    const cx = W / 2, cy = battleCY(), br = baseR();
    for (let i = 0; i < 16; i++) { const a = i / 16 * TAU; burst(cx + Math.cos(a) * br, cy + Math.sin(a) * br, 3, '#a8743f', 260, 4, 500, .7); }
    if (b.final) { const bonus = Math.floor(b.t) * CFG.points.finalSecond; R.pts += bonus; pendingPts += bonus; }
    flushPts();
    setPhase('over');
    setTimeout(() => showPanel(b.final, b.t), 700);
  }
  function showPanel(final, secs) {
    if (!root) return;
    el.hpw.hidden = true; el.panel.hidden = false;
    el.panel.innerHTML = `<div class="sg-box" style="--c:${final ? '#ffd447' : '#ff6b7a'}">
      <h3>${final ? 'YOU LASTED' : 'BASE FELL'}</h3>
      ${final ? `<div class="sg-huge">${secs.toFixed(1)}s</div>` : ''}
      <div class="sg-stats">${final ? '' : `<div><b>${R.round}</b><span>wave</span></div>`}<div><b>${R.kills}</b><span>zombies</span></div><div><b>+${R.pts}</b><span>points</span></div></div>
      <button class="sg-go">Play again</button></div>`;
    const go = el.panel.querySelector('.sg-go');
    go.onclick = again; go.focus({ preventScroll: true });
  }
  function again() {
    el.panel.hidden = true; newRun();
    doIris(() => startRound());
  }

  /* ---------------- effects ---------------- */
  function burst(x, y, n, col, spd = 200, size = 5, grav = 0, life = .6) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(.3, 1) * spd * U, l = rand(.6, 1) * life;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rand(.6, 1.2) * size * U, col, life: l, max: l, g: grav * U });
    }
    if (parts.length > 700) parts.splice(0, parts.length - 700);
  }
  function floatText(x, y, txt, col, size) {
    floats.push({ x, y, txt, col, size: size * Math.max(.85, U), life: .75, max: .75 });
    if (floats.length > 70) floats.shift();
  }
  function updParts(dt) {
    for (const p of parts) { p.life -= dt; if (p.ring) continue; p.vy += p.g * dt; p.vx *= .985; p.vy *= .985; p.x += p.vx * dt; p.y += p.vy * dt; }
    parts = parts.filter(p => p.life > 0);

    floats = floats.filter(f => f.life > 0);
  }
  function flushPts() { if (pendingPts) { api.addPoints(pendingPts); pendingPts = 0; } ptsT = 0; }

  /* ---------------- drawing ---------------- */
  function rrPath(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  function bakeBattle() {

    g.fillStyle = '#35281f'; g.beginPath(); g.arc(cx, cy, br * .92, 0, TAU); g.fill();
    g.fillStyle = '#3e2f24';
    for (let i = 0; i < 18; i++) { const a = rand(0, TAU), d = rand(0, br * .8); g.beginPath(); g.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, rand(2, 4), 0, TAU); g.fill(); }
  }

  function drawSpud(x, y, r, o = {}) {
    const upAim = o.aim != null && Math.sin(o.aim) < -.2;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, r * .95, r * .8, r * .24, 0, 0, TAU); ctx.fill();
    ctx.restore();

    ctx.lineWidth = Math.max(2, r * .13); ctx.strokeStyle = INK; ctx.lineJoin = 'round';
    ell(0, 0, r * .9, r, o.col);
    ctx.fillStyle = 'rgba(27,18,34,.16)';
    for (const [fx, fy, fr] of [[-.45, .35, .08], [.5, .22, .07], [.28, .58, .06], [-.15, .7, .05]]) { ctx.beginPath(); ctx.arc(fx * r, fy * r, fr * r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,120,140,.35)';
    ctx.beginPath(); ctx.ellipse(-.52 * r, .12 * r, .14 * r, .08 * r, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(.52 * r, .12 * r, .14 * r, .08 * r, 0, 0, TAU); ctx.fill();
    const lk = o.look ?? Math.PI / 2, lx = Math.cos(lk) * r * .07, ly = Math.sin(lk) * r * .07;
    const blink = Math.sin(clock * 1.3 + (o.seed || 0) * 2.1) > .985;
    ctx.lineWidth = Math.max(1.5, r * .08);
    for (const ex of [-.3, .3]) {
      ell(ex * r, -.18 * r, .2 * r, blink ? .03 * r : .24 * r, '#ffffff');
      if (!blink) { ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ex * r + lx, -.15 * r + ly, .1 * r, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex * r + lx + .04 * r, -.19 * r + ly, .035 * r, 0, TAU); ctx.fill(); }
    }
    ctx.lineWidth = Math.max(1.5, r * .09); ctx.beginPath();
    if (o.sad) ctx.arc(0, .42 * r, .17 * r, 1.15 * Math.PI, 1.85 * Math.PI); else ctx.arc(0, .2 * r, .2 * r, .15 * Math.PI, .85 * Math.PI);
    ctx.stroke();
    if (o.hat) {
      ctx.lineWidth = Math.max(2, r * .1);
      ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.ellipse(0, -r * .98, r * .5, r * .38, 0, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e24a4a'; ctx.fillRect(-r * .48, -r * 1.02, r * .96, r * .14);
      ell(0, -r * .86, r * .98, r * .22, '#f2c14e');

  }
  function drawGun(x, y, r, a, kick) {
    ctx.save(); ctx.translate(x, y + r * .15); ctx.rotate(a); ctx.translate(-kick * r * .25, 0);
    ctx.lineWidth = Math.max(2, r * .1); ctx.strokeStyle = INK;
    ctx.fillStyle = '#7d8aa3'; rrPath(ctx, r * .5, -r * .15, r * .78, r * .3, r * .1); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4fd68e'; rrPath(ctx, r * .62, -r * .25, r * .26, r * .14, r * .05); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // Every crop is wheat: green blades first, then six ears that ripen from green to gold.
  const WHEAT = [[-.28, .02], [0, .0], [.28, .02], [-.28, .36], [0, .34], [.28, .36]];  // [x, base y] in plot units, back row first
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
  function ear(x, y, h, kern, stem, sway) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(sway);
    ctx.lineCap = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2, h * .1); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -h * .5); ctx.stroke();
    ctx.strokeStyle = stem; ctx.lineWidth = Math.max(1, h * .05); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -h * .5); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,240,190,.55)'; ctx.lineWidth = Math.max(.8, h * .018);   // whiskers
    for (let k = 0; k < 4; k++) { const ky = -h * (.56 + k * .12); for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sd * h * .09, ky); ctx.lineTo(sd * h * .22, ky - h * .2); ctx.stroke(); } }
    ctx.beginPath(); ctx.moveTo(0, -h * 1.02); ctx.lineTo(0, -h * 1.25); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, h * .035);
    for (let k = 0; k < 4; k++) { const ky = -h * (.56 + k * .12); for (const sd of [-1, 1]) ell(sd * h * .065, ky, h * .075, h * .045, kern, sd * -.65); }
    ell(0, -h * 1.0, h * .055, h * .08, kern);
    ctx.restore();
  }
  function drawCrop(c, x, y, s) {
    let sc, sprout = c.age < .45 && c.popT == null;
    if (c.popT != null) { const k = c.popT / .3; sc = k < .35 ? 1 + k / .35 * .3 : 1.3 * (1 - (k - .35) / .65); }
    else sc = sprout ? easeOutBack(c.age / .45) : easeOutBack((c.age - .45) / .38);
    if (sc <= .01) return;
    const G = c.gold, h = s / 2;
    ctx.save(); ctx.translate(x, y + s * .06); ctx.scale(sc, sc); ctx.lineJoin = 'round';
    if (sprout) {
      ctx.lineCap = 'round';
      for (const [wx, wy] of WHEAT) {
        const bx = wx * s, by = wy * s + s * .04;
        for (const a of [-.35, 0, .35]) {
          ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2.4, s * .05); ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + Math.sin(a) * s * .1, by - Math.cos(a) * s * .12); ctx.stroke();
          ctx.strokeStyle = '#7fd86a'; ctx.lineWidth = Math.max(1.2, s * .025); ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + Math.sin(a) * s * .1, by - Math.cos(a) * s * .12); ctx.stroke();
        }
      }
    } else {
      const ripe = clamp((c.age - .45) / 1.2, 0, 1);   // green -> gold
      ctx.fillStyle = G ? 'rgba(255,212,71,.28)' : `rgba(201,150,52,${(.32 * ripe).toFixed(2)})`;
      rrPath(ctx, -h, -h - s * .06, s, s, s * .14); ctx.fill();
      const kern = G ? mix('#b6e36a', '#ffdf4f', ripe) : mix('#a6dc6c', '#efc35a', ripe);
      const stem = G ? mix('#79c95a', '#f2c23a', ripe) : mix('#79c95a', '#c99a3b', ripe);
      WHEAT.forEach(([wx, wy], i) => ear(wx * s, wy * s, s * .5, kern, stem, Math.sin(clock * 2.2 + c.ph + i * .6) * .08));
      if (G) star(s * .36, -s * .5, s * .09 * (1 + .25 * Math.sin(clock * 6 + c.ph)), clock * 2);
    }
    ctx.restore();
  }
  function star(x, y, r, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = '#fff6c4'; ctx.beginPath();
    for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * .35 : r, a = i / 8 * TAU; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function drawZombie(z, cx, cy) {
    const r = z.size * U, x = cx + z.x, y = cy + z.y, a = Math.atan2(-z.y, -z.x);
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, r * .9, r * .85, r * .25, 0, 0, TAU); ctx.fill();
    ctx.rotate(Math.sin(z.wob) * .12);
    const col = z.flash > 0 ? '#ffffff' : z.slow > 0 ? '#9fe3ff' : z.color;
    ctx.lineWidth = Math.max(2, r * .15); ctx.strokeStyle = INK;
    for (const s of [-1, 1]) { const aa = a + s * .6 + Math.sin(z.wob * 1.3 + s) * .15; ell(Math.cos(aa) * r * .95, Math.sin(aa) * r * .95, r * .3, r * .3, col); }
    ell(0, 0, r, r, col);
    const fx = Math.cos(a) * r * .32, fy = Math.sin(a) * r * .32, px = -Math.sin(a), py = Math.cos(a);
    ctx.lineWidth = Math.max(1.2, r * .08);
    ell(fx + px * r * .32, fy + py * r * .32, r * .26, r * .26, '#ffffff');
    ell(fx - px * r * .3, fy - py * r * .3, r * .18, r * .18, '#fff4c2');
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(fx + px * r * .32 + Math.cos(a) * r * .08, fy + py * r * .32 + Math.sin(a) * r * .08, r * .1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(fx - px * r * .3 + Math.cos(a) * r * .06, fy - py * r * .3 + Math.sin(a) * r * .06, r * .07, 0, TAU); ctx.fill();
    ctx.restore();
    if ((z.kind === 'brute' || z.kind === 'boss') && z.hp < z.max) {
      const w = r * 1.6, k = clamp(z.hp / z.max, 0, 1);
      ctx.fillStyle = INK; ctx.fillRect(x - w / 2 - 2, y - r - 14, w + 4, 8);
      ctx.fillStyle = '#ff5d73'; ctx.fillRect(x - w / 2, y - r - 12, w * k, 4);
    }
  }
  function drawFence(cx, cy, br, hpr) {
    ctx.lineWidth = 5 * U; ctx.strokeStyle = '#6d4a2c'; ctx.beginPath(); ctx.arc(cx, cy, br, 0, TAU); ctx.stroke();

const $ = (s, r = document) => r.querySelector(s);
const NS = 'classcombo:';
const MAX_PLAYERS = 30;
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt = n => Math.round(n || 0).toLocaleString();
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sGet(k, session) { try { return JSON.parse((session ? sessionStorage : localStorage).getItem(NS + k)); } catch { return null; } }
function sSet(k, v, session) { try { const st = session ? sessionStorage : localStorage; v == null ? st.removeItem(NS + k) : st.setItem(NS + k, JSON.stringify(v)); } catch {} }
function rid(n = 10) { let s = ''; for (let i = 0; i < n; i++) s += 'abcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random() * 32)]; return s; }
function makeCode() { let s = ''; for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3500); }

/* Runs fn one call at a time; while one is running, only the latest
   request waits (older ones are dropped). Keeps writes to one document
   in order and never overlapping. */
function latestWriter(fn) {
  let running = false, pending = null, waiters = [];
  async function pump() {
    if (running || !pending) return;
    running = true;
    const args = pending, w = waiters; pending = null; waiters = [];
    try { await fn(...args); w.forEach(x => x.res()); }
    catch (e) { w.forEach(x => x.rej(e)); }
    running = false; pump();
  }
  return (...args) => new Promise((res, rej) => { pending = args; waiters.push({ res, rej }); pump(); });
}

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBYUcCwCH7RuVh7zsanBg46TdqAYHPbUEI",
  authDomain: "spud-siege.firebaseapp.com",
  databaseURL: "https://spud-siege-default-rtdb.europe-west1.firebasedatabase.app",

async function createFirebaseBackend() {
  const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);

    watchPlayers(code, cb) {

// Live sync through the Claude artifact database (works when the page is opened on claude.ai).
async function createCloudBackend(db, user) {
  const myId = await user.id().catch(() => null);
  if (!myId) return null;
  const canHost = await user.canEdit().catch(() => false);
  const canWrite = await user.can('data.write').catch(() => null);
  const onErr = e => { if (e && e.code !== 'unavailable') toast('Lost the live connection. Reload the page to reconnect.'); };
  const writers = {};
  const gameWriter = code => (writers[code] ||= latestWriter(data => db.doc('games/' + code).set(data)));
  const playerWriter = latestWriter(data => db.doc('players/' + myId).set(data));
  return {
    kind: 'cloud', myId, canHost, canPlay: canWrite !== false,
    async getGame(code) { const s = await db.doc('games/' + code).get(); return s.exists ? s.data() : null; },
    setGame(code, data) { return gameWriter(code)(data); },
    watchGame(code, cb) { return db.doc('games/' + code).onSnapshot(s => cb(s.exists ? s.data() : null), onErr); },
    watchPlayers(code, cb) {
      return db.collection('players').where('game', '==', code)
        .onSnapshot(q => cb(q.docs.map(d => ({ id: d.id, ...d.data() }))), onErr);
    },
    setMyPlayer(data) { return playerWriter(data); },
    async countPlayers(code, game) {
      const q = await db.collection('players').where('game', '==', code).get();
      const kicked = new Set(game.kicked || []);
      return q.docs.filter(d => d.id !== myId && !kicked.has(d.id) && !d.data().left).length;
    }
  };
}

// Test mode: syncs between tabs of this browser only.
function createLocalBackend() {
  let myId = sGet('pid', true);
  if (!myId) { myId = 'p' + rid(); sSet('pid', myId, true); }
  const listeners = new Set();
  const emit = () => listeners.forEach(f => f());
  let bc = null;
  try { bc = new BroadcastChannel('classcombo'); bc.onmessage = emit; } catch {}
  addEventListener('storage', e => { if (!e.key || e.key.startsWith(NS)) emit(); });
  const read = k => sGet(k) || {};
  const write = (k, v) => { sSet(k, v); emit(); try { bc && bc.postMessage(1); } catch {} };
  const sub = f => { listeners.add(f); f(); return () => listeners.delete(f); };
  return {
    kind: 'local', myId, canHost: true, canPlay: true,
    async getGame(code) { return read('games')[code] || null; },
    async setGame(code, data) {
      const g = read('games'); g[code] = data;
      const day = Date.now() - 86400000;               // tidy up day-old test games
      for (const c in g) if ((g[c].createdAt || 0) < day) delete g[c];
      write('games', g);
    },
    watchGame(code, cb) { return sub(() => cb(read('games')[code] || null)); },
    watchPlayers(code, cb) {
      return sub(() => cb(Object.entries(read('players')).filter(([, p]) => p.game === code).map(([id, p]) => ({ id, ...p }))));
    },
    async setMyPlayer(data) { const p = read('players'); p[myId] = data; write('players', p); },
    async countPlayers(code, game) {
      const kicked = new Set(game.kicked || []);
      return Object.entries(read('players')).filter(([id, p]) => p.game === code && id !== myId && !kicked.has(id) && !p.left).length;
    }
  };
}

async function pickBackend() {
  if (FIREBASE_CONFIG && !/PASTE/.test(FIREBASE_CONFIG.apiKey || 'PASTE') && window.firebase) {
    try { return await createFirebaseBackend(); }
    catch (e) { console.error(e); toast('Could not connect to the game server. Running in test mode.'); }
  }
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (db && user) { const b = await createCloudBackend(db, user); if (b) return b; }
    } catch {}
  }
  return createLocalBackend();
}

/* --------------------------- shared helpers --------------------------- */
let B = null;
function show(view) {
  for (const s of document.querySelectorAll('.view')) s.hidden = s.id !== 'v-' + view;
  scrollTo(0, 0);
}
function remainingMs(g, now = Date.now()) {
  if (!g || !g.durationSec) return Infinity;
  const used = (g.elapsedMs || 0) + (g.runningSince ? now - g.runningSince : 0);
  return Math.max(0, g.durationSec * 1000 - used);
}
function clockText(g) {
  const r = remainingMs(g);
  if (r === Infinity) return '∞';
  const s = Math.ceil(r / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function activePlayers(g, players) {
  const kicked = new Set(g.kicked || []);
  return players.filter(p => !kicked.has(p.id) && !p.left)
    .map(p => ({ ...p, pts: p.round === g.round ? (p.score || 0) : 0 }));
}
const tweens = new WeakMap();
function setNum(el, to) {
  const from = Number(el.dataset.v || 0); el.dataset.v = to;
  if (REDUCE || from === to) { el.textContent = fmt(to); return; }
  cancelAnimationFrame(tweens.get(el));
  const t0 = performance.now(), d = 650;
  const step = t => {
    const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1) tweens.set(el, requestAnimationFrame(step));
  };
  tweens.set(el, requestAnimationFrame(step));
}
function setMeter(el, total, goal) {
  const pct = goal > 0 ? Math.min(100, total / goal * 100) : 0;
  el.querySelector('.fill').style.width = pct + '%';
  el.classList.toggle('done', goal > 0 && total >= goal);
}
function confetti() {
  if (REDUCE) return;
  const c = $('#confetti'), ctx = c.getContext('2d');
  c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const css = getComputedStyle(document.documentElement);
  const cols = ['--accent', '--cobalt', '--good'].map(v => css.getPropertyValue(v).trim());
  const bits = Array.from({ length: 140 }, () => ({
    x: c.width / 2 + (Math.random() - .5) * c.width * .5, y: c.height * .35,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4,
    a: Math.random() * 6, va: (Math.random() - .5) * .4, col: cols[Math.floor(Math.random() * 3)]
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const b of bits) {
      b.vy += .35; b.x += b.vx; b.y += b.vy; b.a += b.va;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = b.col; ctx.fillRect(-b.r / 2, -b.r / 4, b.r, b.r / 2); ctx.restore();
    }
    if (t - t0 < 2600) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })(t0);
}

/* =============================== TEACHER =============================== */
const T = { code: null, game: null, players: [], unsub: [], lastStatus: null, armedEnd: false, armedRemove: null, seen: new Set(), goalShown: false, ending: false };

function saveGame(patch) {
  T.game = { ...T.game, ...patch };
  tRender();
  return B.setGame(T.code, T.game).catch(() => toast('Could not save that change. Check your connection and try again.'));
}

async function createGame(e) {
  e.preventDefault();
  const title = $('#f-title').value.trim() || 'Spud Siege';
  const goal = Math.max(1, Math.round(Number($('#f-goal').value) || 0));
  const durationSec = Number($('#f-dur').value);
  if (!(Number($('#f-goal').value) > 0)) { $('#setup-err').textContent = 'Set a class goal of at least 1 point.'; return; }
  $('#setup-err').textContent = '';
  $('#f-create').disabled = true;
  try {
    let code = makeCode();
    for (let i = 0; i < 5 && await B.getGame(code); i++) code = makeCode();
    const game = { title, goal, durationSec, status: 'lobby', round: 1, elapsedMs: 0, runningSince: null,
                   kicked: [], host: B.myId, createdAt: Date.now() };
    await B.setGame(code, game);
    sSet('host', code);
    openDashboard(code, game);
  } catch {
    $('#setup-err').textContent = 'Could not create the game. Check your connection and try again.';
  } finally { $('#f-create').disabled = false; }
}

function openDashboard(code, game) {
  T.unsub.forEach(u => u()); T.unsub = [];
  Object.assign(T, { code, game, players: [], lastStatus: null, seen: new Set(), goalShown: false, ending: false });
  try { $('#t-showscores').checked = sGet('showscores') !== false; } catch {}
  show('teacher');
  $('#t-code').innerHTML = code.split('').map(ch => `<span class="tile">${ch}</span>`).join('');
  T.unsub.push(B.watchGame(code, g => { if (g) { T.game = g; tRender(); } }));
  T.unsub.push(B.watchPlayers(code, ps => { T.players = ps; tRender(); }));
  tRender();
}

function tControls(status) {
  const box = $('#t-controls');
  const b = (label, cls, fn) => { const el = document.createElement('button'); el.className = 'btn ' + cls; el.textContent = label; el.onclick = fn; box.append(el); return el; };
  box.innerHTML = ''; T.armedEnd = false;
  if (status === 'lobby') b('Start', 'primary big', () => saveGame({ status: 'playing', runningSince: Date.now() }));
  if (status === 'playing') b('Pause', 'blue', () => saveGame({ status: 'paused', elapsedMs: (T.game.elapsedMs || 0) + (Date.now() - T.game.runningSince), runningSince: null }));
  if (status === 'paused') b('Resume', 'primary big', () => saveGame({ status: 'playing', runningSince: Date.now() }));
  if (status === 'playing' || status === 'paused') {
    const end = b('End', 'danger', () => {
      if (!T.armedEnd) { T.armedEnd = true; end.classList.add('armed'); end.textContent = 'Sure?'; setTimeout(() => { if (end.isConnected) { T.armedEnd = false; end.classList.remove('armed'); end.textContent = 'End'; } }, 3500); return; }
      endRound();
    });
  }
  if (status === 'ended') {
    b('Play again', 'primary big', () => { T.goalShown = false; saveGame({ status: 'lobby', round: (T.game.round || 1) + 1, elapsedMs: 0, runningSince: null }); });
    b('New game', '', () => { closeDashboard(); show('setup'); });
  }
}

function endRound() {
  const g = T.game;
  const elapsed = (g.elapsedMs || 0) + (g.runningSince ? Date.now() - g.runningSince : 0);
  saveGame({ status: 'ended', elapsedMs: g.durationSec ? Math.min(elapsed, g.durationSec * 1000) : elapsed, runningSince: null, endedAt: Date.now() });
}

function tRender() {
  const g = T.game; if (!g) return;
  const labels = { lobby: 'Ready', playing: 'Playing', paused: 'Paused', ended: 'Round over' };
  const pill = $('#t-status'); pill.className = 'pill ' + g.status; pill.textContent = labels[g.status];
  $('#t-round').textContent = 'Round ' + g.round;
  if (T.lastStatus !== g.status) { tControls(g.status); T.lastStatus = g.status; }
  $('#t-title').textContent = g.title;

  // settings (editable only between rounds)
  const editable = g.status === 'lobby' || g.status === 'ended';
  for (const [id, v] of [['#s-title', g.title], ['#s-goal', g.goal], ['#s-dur', g.durationSec]]) {
    const el = $(id); el.disabled = !editable; if (document.activeElement !== el) el.value = v;
  }
  $('#s-lock').hidden = editable;

  // totals
  const ps = activePlayers(g, T.players);
  const total = ps.reduce((a, p) => a + p.pts, 0);
  setNum($('#t-total'), total);
  $('#t-of').innerHTML = `of <b>${fmt(g.goal)}</b> points` + (total > g.goal ? ` · <b>${fmt(total - g.goal)}</b> over the goal` : '');
  setMeter($('#t-meter'), total, g.goal);
  $('#t-ticks').innerHTML = [0, .25, .5, .75, 1].map(f => `<span class="num" style="left:${f * 100}%">${fmt(g.goal * f)}</span>`).join('');
  const reached = total >= g.goal && g.status !== 'lobby';
  $('#t-goal').hidden = !reached;
  if (reached && !T.goalShown) { T.goalShown = true; confetti(); }
  if (!reached) T.goalShown = false;

  // round summary
  const sum = $('#t-summary');
  if (g.status === 'ended') {
    const scorers = ps.filter(p => p.pts > 0).length;
    sum.hidden = false;
    sum.innerHTML = `<b>Round ${g.round} over</b> · ${ps.length} players · <b>${fmt(total)}</b> / ${fmt(g.goal)}`;
    void scorers;
  } else sum.hidden = true;

  // players
  const showScores = $('#t-showscores').checked;
  const list = showScores ? [...ps].sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name))
                          : [...ps].sort((a, b) => a.name.localeCompare(b.name));
  $('#t-count').textContent = ps.length;
  $('#t-empty').hidden = ps.length > 0;
  $('#t-players').innerHTML = list.map((p, i) => {
    const isNew = !T.seen.has(p.id);
    const armed = T.armedRemove === p.id;
    return `<li class="${isNew ? 'new ' : ''}${showScores && i < 3 && p.pts > 0 ? 'top' : ''}">
      ${showScores ? `<span class="rank">${i + 1}</span>` : ''}
      <span class="pname" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</span>
      ${showScores ? `<span class="pscore">${fmt(p.pts)}</span>` : ''}
      <button class="x${armed ? ' armed' : ''}" data-remove="${escapeHtml(p.id)}" aria-label="Remove ${escapeHtml(p.name)}">${armed ? 'Remove?' : '✕'}</button>
    </li>`;
  }).join('');
  ps.forEach(p => T.seen.add(p.id));
}

function tTick() {
  const g = T.game;
  if (g && !$('#v-teacher').hidden) {
    const r = remainingMs(g);
    $('#t-clocklabel').textContent = 'Time';
    const c = $('#t-clock'); c.textContent = clockText(g); c.classList.toggle('low', r < 30000 && g.status === 'playing');
    if (g.status === 'playing' && r <= 0 && !T.ending) { T.ending = true; endRound(); setTimeout(() => T.ending = false, 3000); }
  }
}

function closeDashboard() {
  T.unsub.forEach(u => u()); T.unsub = []; T.game = null; T.code = null; sSet('host', null);
}

/* =============================== STUDENT =============================== */
const P = { code: null, name: '', game: null, players: [], round: null, score: 0, mounted: false, paused: false, unsub: [], flushTimer: null, dirty: false, goalShown: false, joinedAt: 0, stats: {} };

async function joinGame(e) {
  e && e.preventDefault();
  const code = $('#j-code').value.trim().toUpperCase();
  const name = $('#j-name').value.trim().replace(/\s+/g, ' ');
  const err = $('#join-err');
  if (code.length !== 4) { err.textContent = 'Code needs 4 characters'; return; }
  if (!name) { err.textContent = 'Type your name'; return; }
  err.textContent = ''; $('#j-go').disabled = true;
  try {
    const g = await B.getGame(code);
    if (!g) { err.textContent = `No game called ${code}`; return; }
    if (await B.countPlayers(code, g) >= MAX_PLAYERS) { err.textContent = `Game full (${MAX_PLAYERS})`; return; }
    if ((g.kicked || []).includes(B.myId)) { err.textContent = 'Removed from this game'; return; }
    enterGame(code, name, g);
  } catch { err.textContent = 'No connection. Try again.'; }
  finally { $('#j-go').disabled = false; }
}

function enterGame(code, name, g) {
  P.unsub.forEach(u => u());
  Object.assign(P, { code, name, game: g, players: [], round: g.round, score: 0, mounted: false, paused: false, unsub: [], goalShown: false, joinedAt: Date.now(), overlay: undefined, stats: {} });
  const saved = sGet('student', true);
  if (saved && saved.code === code && saved.round === g.round) P.score = saved.score || 0;  // keep points after a reload
  sSet('student', { code, name, round: g.round, score: P.score }, true);
  $('#p-name').textContent = name;
  $('#p-mode').textContent = B.kind === 'local' ? 'Test mode' : '';
  show('student');
  writeMe();
  P.unsub.push(B.watchGame(code, onStudentGame));
  P.unsub.push(B.watchPlayers(code, ps => { P.players = ps; pRender(); }));
}

function writeMe() {
  if (P.solo) return;
  P.dirty = true;
  sSet('student', { code: P.code, name: P.name, round: P.round, score: P.score }, true);
  if (!P.flushTimer) P.flushTimer = setTimeout(flushMe, 1200);
}
async function flushMe() {
  P.flushTimer = null;
  if (!P.dirty || !P.code) return;
  P.dirty = false;
  try {
    await B.setMyPlayer({ game: P.code, name: P.name, score: P.score, round: P.round, stats: P.stats, joinedAt: P.joinedAt, updatedAt: Date.now(), left: false });
  } catch {
    P.dirty = true; toast('Your points could not be saved yet. Trying again…');
    P.flushTimer = setTimeout(flushMe, 3000);
  }
}

const gameApi = {
  addPoints(n) {
    n = Math.round(Number(n) || 0);
    if (!gameApi.isRunning() || !n) return false;
    P.score = Math.max(0, P.score + n);
    writeMe(); pRender();
    if (n > 0 && !REDUCE) { const f = document.createElement('span'); f.className = 'float'; f.textContent = '+' + n; $('.mine').append(f); setTimeout(() => f.remove(), 900); }
    return true;
  },
  getScore: () => P.score,
  get playerName() { return P.name; },
  setStats(obj) { P.stats = { ...P.stats, ...obj }; writeMe(); },
  getClassmates() {
    if (!P.game) return [];
    return activePlayers(P.game, P.players).filter(p => p.id !== B.myId)
      .map(p => ({ name: String(p.name || 'Player'), lv: Number(p.stats && p.stats.lv) || 1 }));
  },
  isRunning: () => !!P.game && P.game.status === 'playing' && remainingMs(P.game) > 0
};

function mountGame() {
  if (P.mounted) return;
  const stage = $('#game-stage'); stage.innerHTML = '';
  P.mounted = true; P.paused = false;
  try { Game.mount(stage, gameApi); } catch (e) { console.error(e); toast('The game hit an error while starting.'); }
}
function unmountGame() {
  if (!P.mounted) return;
  try { Game.unmount(); } catch (e) { console.error(e); }
  $('#game-stage').innerHTML = ''; P.mounted = false; P.paused = false;
}

function onStudentGame(g) {
  if (!g) { unmountGame(); P.game = null; overlay('closed'); return; }
  if ((g.kicked || []).includes(B.myId)) { leaveGame(); $('#join-err').textContent = 'Removed from this game'; show('join'); return; }
  P.game = g;
  if (g.round !== P.round) { unmountGame(); P.round = g.round; P.score = 0; P.goalShown = false; writeMe(); }
  if (g.status === 'playing') {
    mountGame();
    if (P.paused) { P.paused = false; try { Game.resume(); } catch {} }
    overlay(null);
  } else if (g.status === 'paused') {
    if (P.mounted && !P.paused) { P.paused = true; try { Game.pause(); } catch {} }
    overlay('paused');
  } else if (g.status === 'ended') { unmountGame(); overlay('ended'); }
  else { unmountGame(); overlay('lobby'); }
  pRender();
}

function classTotal() {
  const g = P.game; if (!g) return 0;
  return activePlayers(g, P.players).reduce((a, p) => a + (p.id === B.myId ? P.score : p.pts), 0)
    + (P.players.some(p => p.id === B.myId) ? 0 : P.score);
}

function overlay(kind) {
  const o = $('#p-overlay'), m = $('#p-msg');
  if (kind === P.overlay && (!kind || m.childElementCount)) { o.hidden = !kind; return; }
  P.overlay = kind;
  if (!kind) { o.hidden = true; return; }
  o.hidden = false;
  const g = P.game;
  if (kind === 'lobby') m.innerHTML = `<div class="waitdots" aria-hidden="true"><i></i><i></i><i></i></div><h2>You're in!</h2><p id="p-wait"></p>`;
  if (kind === 'paused') m.innerHTML = `<h2>Paused</h2>`;
  if (kind === 'ended') m.innerHTML = `<h2>Round over</h2><span class="bignum num" id="p-final">${fmt(P.score)}</span><p id="p-endline"></p>`;
  if (kind === 'closed') m.innerHTML = `<h2>Game closed</h2><button class="btn primary" id="p-back">Back</button>`;
  const back = $('#p-back'); if (back) back.onclick = () => { leaveGame(); show('home'); };
}

function pRender() {
  const g = P.game; if (!g) return;
  $('#p-gtitle').textContent = g.title;
  setNum($('#p-score'), P.score);
  const total = classTotal();
  setNum($('#p-total'), total);
  $('#p-goal').textContent = '/ ' + fmt(g.goal);
  setMeter($('#p-meter'), total, g.goal);
  if (total >= g.goal && g.status !== 'lobby' && !P.goalShown) { P.goalShown = true; confetti(); toast('Goal reached!'); }
  const count = activePlayers(g, P.players).length;
  const w = $('#p-wait'); if (w) w.textContent = `👥 ${count}`;
  const el = $('#p-endline');
  if (el) el.textContent = `Class: ${fmt(total)} / ${fmt(g.goal)}`;
  const f = $('#p-final'); if (f) f.textContent = fmt(P.score);
}

function pTick() {
  if (P.game && !$('#v-student').hidden) {
    $('#p-clocklabel').textContent = 'Time';
    $('#p-clock').textContent = clockText(P.game);
  }
}

// Solo: play on this computer only, nothing is saved or shared.
function startSolo() {
  leaveGame();
  Object.assign(P, { solo: true, code: null, name: 'Solo', players: [], round: 1, score: 0, mounted: false, paused: false,
    unsub: [], goalShown: false, joinedAt: Date.now(), overlay: undefined, stats: {},
    game: { title: 'Solo', goal: 1000, status: 'playing', round: 1, durationSec: 0, elapsedMs: 0, runningSince: Date.now(), kicked: [] } });
  $('#p-name').textContent = 'Solo';
  $('#p-mode').textContent = 'Solo · not counted';
  show('student');
  overlay(null); mountGame(); pRender();
}

function leaveGame() {
  if (P.code && B) {
    clearTimeout(P.flushTimer); P.flushTimer = null;
    B.setMyPlayer({ game: P.code, name: P.name, score: P.score, round: P.round, stats: P.stats, joinedAt: P.joinedAt, updatedAt: Date.now(), left: true }).catch(() => {});
  }
  unmountGame();
  P.unsub.forEach(u => u()); P.unsub = []; P.code = null; P.game = null; P.solo = false;
  sSet('student', null, true);
}

/* ================================ WIRING ================================ */
$('#go-teacher').onclick = () => show('setup');
$('#go-student').onclick = () => { show('join'); $('#j-code').focus(); };
$('#go-solo').onclick = startSolo;
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));
$('#setup-form').addEventListener('submit', createGame);
$('#join-form').addEventListener('submit', joinGame);
$('#j-code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
$('#t-close').onclick = () => { closeDashboard(); show('home'); };
$('#p-leave').onclick = () => { leaveGame(); show('home'); };
$('#t-showscores').onchange = e => { sSet('showscores', e.target.checked); tRender(); };
$('#s-title').onchange = e => saveGame({ title: e.target.value.trim() || 'Spud Siege' });
$('#s-goal').onchange = e => { const v = Math.round(Number(e.target.value)); if (v > 0) saveGame({ goal: v }); else e.target.value = T.game.goal; };
$('#s-dur').onchange = e => saveGame({ durationSec: Number(e.target.value), elapsedMs: 0, runningSince: null });
$('#t-players').addEventListener('click', e => {
  const btn = e.target.closest('[data-remove]'); if (!btn) return;
  const id = btn.dataset.remove;
  if (T.armedRemove !== id) {
    T.armedRemove = id; tRender();
    setTimeout(() => { if (T.armedRemove === id) { T.armedRemove = null; tRender(); } }, 3000);
    return;
  }
  T.armedRemove = null;
  saveGame({ kicked: [...new Set([...(T.game.kicked || []), id])] });
});
setInterval(() => { tTick(); pTick(); }, 250);

(async function init() {
  B = await pickBackend();
  const line = $('#mode-line');
  line.innerHTML = B.kind !== 'local'
    ? '<span class="dot live"></span><span>Live</span>'
    : '<span class="dot test"></span><span>Test mode · this browser only</span>';
  const tBtn = $('#go-teacher'), sBtn = $('#go-student');
  tBtn.disabled = !B.canHost; sBtn.disabled = !B.canPlay; $('#go-solo').disabled = false;
  if (!B.canHost) tBtn.insertAdjacentHTML('beforeend', '<span class="note">Owner or editors only</span>');
  if (!B.canPlay) sBtn.insertAdjacentHTML('beforeend', '<span class="note">Ask your teacher for access</span>');

  // Pick up where this browser left off after a reload.
  try {
    const st = sGet('student', true);
    if (st && st.code && B.canPlay) {
      const g = await B.getGame(st.code);
      if (g && !(g.kicked || []).includes(B.myId)) { $('#j-code').value = st.code; $('#j-name').value = st.name; return enterGame(st.code, st.name, g); }
    }
    const host = sGet('host');
    if (host && B.canHost) {
      const g = await B.getGame(host);
      if (g && g.host === B.myId) return openDashboard(host, g);
    }
  } catch {}
})();
</script>
